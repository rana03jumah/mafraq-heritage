<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المرشد الأثري الذكي - المفرق</title>

  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
    body { font-family: 'Cairo', sans-serif; }
    #map { height: 320px; border-radius: 1rem; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-24">

  <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <i class="fa-solid fa-landmark text-amber-500 text-xl"></i>
      <span class="font-bold text-lg text-slate-100">آثار المفرق الرقمية</span>
    </div>
    
    <button id="lang-btn" onclick="toggleLanguage()" class="bg-slate-800 border border-slate-700 text-xs px-3 py-1.5 rounded-full font-semibold hover:bg-slate-700 transition">
      English
    </button>
  </header>

  <main class="max-w-md mx-auto px-4 pt-6 space-y-6">

    <div class="relative bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-2xl overflow-hidden">
      <div id="unesco-badge" class="hidden absolute top-3 left-3 bg-amber-500/20 text-amber-400 border border-amber-500/30 text-xs px-2.5 py-1 rounded-full font-bold">
        <i class="fa-solid fa-award ml-1"></i> UNESCO World Heritage
      </div>

      <span id="site-era" class="text-xs font-semibold text-amber-500 tracking-wider uppercase block mb-1">...</span>
      <h1 id="site-title" class="text-2xl font-black text-white mb-3">جاري التحميل...</h1>
      <p id="site-desc" class="text-slate-300 text-sm leading-relaxed mb-4"></p>

      <div class="grid grid-cols-2 gap-3">
        <button onclick="scrollSection('audio-section')" class="bg-amber-600 hover:bg-amber-500 text-white py-2.5 px-4 rounded-xl text-xs font-bold flex items-center justify-center gap-2 shadow-lg shadow-amber-600/20 transition">
          <i class="fa-solid fa-headphones"></i> الاستماع للشرح
        </button>
        <button onclick="scrollSection('map-section')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 py-2.5 px-4 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition">
          <i class="fa-solid fa-map-location-dot"></i> الخريطة والمعالم
        </button>
      </div>
    </div>

    <section id="audio-section" class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
      <h2 class="text-sm font-bold text-slate-200 mb-3 flex items-center gap-2">
        <i class="fa-solid fa-volume-high text-amber-500"></i> الدليل الصوتي التفاعلي
      </h2>
      <audio id="audio-player" controls class="w-full rounded-lg mb-3">
        متصفحك لا يدعم تشغيل الصوت.
      </audio>
      <div class="flex justify-between items-center text-xs text-slate-400">
        <span>السرعة:</span>
        <div class="space-x-1 space-x-reverse">
          <button onclick="setAudioSpeed(0.75)" class="px-2 py-1 bg-slate-800 rounded border border-slate-700 hover:bg-slate-700">0.75x</button>
          <button onclick="setAudioSpeed(1.0)" class="px-2 py-1 bg-amber-600 text-white rounded font-bold">1.0x</button>
          <button onclick="setAudioSpeed(1.25)" class="px-2 py-1 bg-slate-800 rounded border border-slate-700 hover:bg-slate-700">1.25x</button>
        </div>
      </div>
    </section>

    <section id="map-section" class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-3">
      <h2 class="text-sm font-bold text-slate-200 flex items-center gap-2">
        <i class="fa-solid fa-map text-amber-500"></i> معالم الموقع والمسار
      </h2>
      <div id="map"></div>
      <div id="landmarks-list" class="space-y-2 pt-2">
        </div>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
