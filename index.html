<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة آثار المفرق الرقمية</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>

  <!-- Leaflet CSS & JS for Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
    body { font-family: 'Cairo', sans-serif; }
    #map { height: 280px; border-radius: 1rem; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-300">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 py-3 flex justify-between items-center transition-colors">
    <div class="flex items-center gap-3 cursor-pointer" onclick="showCatalogView()">
      <div class="w-10 h-10 rounded-xl bg-amber-500/10 flex items-center justify-center text-amber-500 font-bold text-xl">
        <i class="fa-solid fa-landmark"></i>
      </div>
      <div>
        <h1 class="font-black text-base leading-tight">آثار المفرق</h1>
        <p class="text-[10px] text-slate-500 dark:text-slate-400 font-semibold">المرشد الرقمي الذكي</p>
      </div>
    </div>

    <!-- Controls -->
    <div class="flex items-center gap-2">
      <!-- Dark/Light Theme Button -->
      <button onclick="toggleTheme()" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-700 transition">
        <i id="theme-icon" class="fa-solid fa-moon"></i>
      </button>

      <!-- Language Switcher -->
      <button id="lang-btn" onclick="toggleLanguage()" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-bold text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 transition">
        English
      </button>
    </div>
  </header>

  <!-- Container -->
  <main class="max-w-md mx-auto px-4 py-6">

    <!-- 1. CATALOG VIEW (معرض المواقع) -->
    <section id="catalog-view" class="space-y-5">
      <div class="text-center space-y-1">
        <h2 class="text-2xl font-black text-slate-900 dark:text-white">المواقع الأثرية في المفرق</h2>
        <p class="text-xs text-slate-500 dark:text-slate-400">اختر موقعاً أثرياً للبدء برحلة الاستكشاف والتجول الرقمي</p>
      </div>

      <!-- Sites Cards Grid -->
      <div id="sites-grid" class="grid grid-cols-1 gap-4">
        <!-- يتم توليد البطاقات ديناميكياً بواسطة JavaScript -->
      </div>
    </section>


    <!-- 2. DETAIL VIEW (تفاصيل الموقع الأثري المحدد) -->
    <section id="detail-view" class="hidden space-y-5">
      
      <!-- Back Button -->
      <button onclick="showCatalogView()" class="inline-flex items-center gap-2 text-xs font-bold text-amber-600 dark:text-amber-500 bg-amber-500/10 px-3 py-2 rounded-xl hover:bg-amber-500/20 transition">
        <i class="fa-solid fa-arrow-right"></i> عودة لمعرض المواقع
      </button>

      <!-- Hero Header -->
      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-xl transition-colors space-y-3">
        <div class="flex justify-between items-start gap-2">
          <div>
            <span id="site-era" class="text-[11px] font-bold text-amber-600 dark:text-amber-500 uppercase tracking-wide">...</span>
            <h1 id="site-title" class="text-2xl font-black text-slate-900 dark:text-white">...</h1>
          </div>
          <span id="unesco-badge" class="hidden shrink-0 bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/20 text-[10px] px-2.5 py-1 rounded-full font-bold">
            <i class="fa-solid fa-award ml-1"></i> UNESCO
          </span>
        </div>
        <p id="site-desc" class="text-slate-600 dark:text-slate-300 text-xs leading-relaxed"></p>
      </div>

      <!-- Audio Player -->
      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-xl transition-colors space-y-3">
        <h3 class="text-xs font-bold text-slate-800 dark:text-slate-200 flex items-center gap-2">
          <i class="fa-solid fa-volume-high text-amber-500"></i> الدليل الصوتي التفاعلي
        </h3>
        <audio id="audio-player" controls class="w-full rounded-lg">
          متصفحك لا يدعم الصوت.
        </audio>
      </div>

      <!-- Before / After Historical Reconstruction Slider -->
      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-xl transition-colors space-y-3">
        <h3 class="text-xs font-bold text-slate-800 dark:text-slate-200 flex items-center gap-2">
          <i class="fa-solid fa-clock-rotate-left text-amber-500"></i> التخيل التاريخي للموقع (الماضي والحاضر)
        </h3>
        
        <div class="relative w-full h-56 overflow-hidden rounded-xl select-none">
          <img id="img-past" src="" alt="الماضي" class="absolute inset-0 w-full h-full object-cover">
          <div id="present-wrapper" class="absolute top-0 left-0 h-full w-1/2 overflow-hidden border-r-2 border-amber-500 transition-all">
            <img id="img-present" src="" alt="الحاضر" class="absolute top-0 left-0 h-full max-w-none w-full object-cover">
          </div>
          <input type="range" min="0" max="100" value="50" oninput="updateBeforeAfter(this.value)" class="absolute inset-0 w-full h-full opacity-0 cursor-ew-resize">
        </div>
        <div class="flex justify-between text-[11px] font-bold text-slate-500 dark:text-slate-400">
          <span>◀ التخيل في الماضي</span>
          <span>الواقع الحالي ▶</span>
        </div>
      </div>

      <!-- Map & Landmarks -->
      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-xl transition-colors space-y-3">
        <h3 class="text-xs font-bold text-slate-800 dark:text-slate-200 flex items-center gap-2">
          <i class="fa-solid fa-map-location-dot text-amber-500"></i> خريطة المعالم الأثرية
        </h3>
        <div id="map"></div>
        <div id="landmarks-list" class="space-y-2 pt-2"></div>
      </div>

    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
